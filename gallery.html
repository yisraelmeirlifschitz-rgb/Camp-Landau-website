<title>Camp Landau — Photo Gallery</title>
<link rel="icon" type="image/png" href="/Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#e85d26}
body{font-family:'Figtree',sans-serif;background:#f8f8f8;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:4px solid rgba(232,93,38,.3);box-shadow:0 2px 12px rgba(0,0,0,.07);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
header img{height:52px;cursor:pointer}
header h1{font-size:clamp(18px,2.5vw,26px);font-weight:900;color:#1a1a1a}
header a{margin-left:auto;font-size:14px;font-weight:700;color:var(--primary);text-decoration:none;padding:8px 18px;border:2px solid var(--primary);border-radius:50px;transition:background .2s,color .2s}
header a:hover{background:var(--primary);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:20px;max-width:1400px;margin:0 auto}
.gitem{aspect-ratio:4/3;overflow:hidden;border-radius:10px;cursor:pointer;background:#ddd}
.gitem img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
.gitem:hover img{transform:scale(1.05)}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;align-items:center;justify-content:center}
.lightbox.open{display:flex}
#lbImg{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:8px}
.lb-close{position:fixed;top:18px;right:24px;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:28px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb-close:hover{background:rgba(255,255,255,.3)}
.lb-arrow{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:none;font-size:36px;width:50px;height:70px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb-arrow:hover{background:rgba(255,255,255,.3)}
.prev{left:12px}.next{right:12px}
.loading{text-align:center;padding:60px;color:#888;font-size:18px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:5px;padding:10px}}
</style>
</head>

const THUMB='=w500-h375-no';
const FULL='=w1400-h1050-no';
let lbUrls=[];
let lbIdx=0;
const grid=document.getElementById('grid');

function openLb(url){
  lbIdx=lbUrls.indexOf(url);
  document.getElementById('lbImg').src=url;
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow='';
}
function lbNav(dir){
  lbIdx=(lbIdx+dir+lbUrls.length)%lbUrls.length;
  document.getElementById('lbImg').src=lbUrls[lbIdx];
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowRight')lbNav(1);
  if(e.key==='ArrowLeft')lbNav(-1);
});

grid.innerHTML='';
const BATCH=30;
let loaded=0;

function loadBatch(){
  const batch=GPHOTO_URLS.slice(loaded,loaded+BATCH);
  batch.forEach((u,i)=>{
    const fullUrl=u+FULL;
    lbUrls.push(fullUrl);
    const div=document.createElement('div');
    div.className='gitem';
    const img=document.createElement('img');
    img.src=u+THUMB;
    img.alt='Camp Landau photo';
    img.loading='lazy';
    img.onerror=()=>div.style.display='none';
    div.appendChild(img);
    div.addEventListener('click',()=>openLb(fullUrl));
    grid.appendChild(div);
  });
  loaded+=BATCH;
  if(loaded<GPHOTO_URLS.length){
    setTimeout(loadBatch,200);
  }
}
loadBatch();
