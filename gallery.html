<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#e85d26}
body{font-family:'Figtree',sans-serif;background:#f8f8f8;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:4px solid rgba(232,93,38,.3);box-shadow:0 2px 12px rgba(0,0,0,.07);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
header img{height:52px;width:auto;cursor:pointer}
header h1{font-size:clamp(18px,2.5vw,26px);font-weight:900;color:#1a1a1a}
header a{margin-left:auto;font-size:14px;font-weight:700;color:var(--primary);text-decoration:none;padding:8px 18px;border:2px solid var(--primary);border-radius:50px;transition:background .2s,color .2s}
header a:hover{background:var(--primary);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:20px;max-width:1400px;margin:0 auto}
.gitem{aspect-ratio:4/3;overflow:hidden;border-radius:10px;cursor:pointer;background:#ddd}
.gitem img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
.gitem:hover img{transform:scale(1.05)}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;align-items:center;justify-content:center}
.lightbox.open{display:flex}
#lbImg{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:8px}
.lb-close{position:fixed;top:18px;right:24px;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:28px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb-close:hover{background:rgba(255,255,255,.3)}
.lb-arrow{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:none;font-size:36px;width:50px;height:70px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb-arrow:hover{background:rgba(255,255,255,.3)}
.prev{left:12px}.next{right:12px}
.loading{text-align:center;padding:60px;color:#888;font-size:18px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:5px;padding:10px}}

/* Floating SimplySite credit, bottom right */
.ss-badge{position:fixed;right:18px;bottom:18px;z-index:150;display:flex;align-items:center;gap:8px;padding:7px 13px;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border:1px solid rgba(26,26,26,.07);border-radius:99px;box-shadow:0 4px 16px rgba(0,0,0,.1);text-decoration:none;opacity:.88;transition:opacity .25s ease,transform .25s ease,box-shadow .25s ease}
.ss-badge:hover{opacity:1;transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.16)}
.ss-badge:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.ss-badge img{display:block;height:21px;width:auto}
.ss-txt{font-family:'Figtree',sans-serif;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(26,26,26,.42);line-height:1;white-space:nowrap}
.ss-badge.gone{opacity:0;transform:translateY(14px);pointer-events:none}
@media(max-width:600px){
  .ss-badge{right:12px;bottom:12px;padding:6px 12px;gap:0}
  .ss-txt{display:none}
  .ss-badge img{height:18px}
}
@media(prefers-reduced-motion:reduce){
  .ss-badge,.ss-badge:hover,.ss-badge.gone{transition:opacity .25s ease;transform:none}
}
</style>

<body>
<header>
  <img src="/img/logo-sm.webp" width="211" height="140" alt="Camp Landau" onclick="location.href='/'">
  <h1>Photo Gallery</h1>
  <a href="/">← Back to Site</a>
</header>

<main>
<div class="grid" id="grid"><div class="loading">Loading photos...</div></div>
</main>

<div class="lightbox" id="lb" onclick="closeLb()">
  <button class="lb-close" onclick="closeLb()" aria-label="Close">✕</button>
  <button class="lb-arrow prev" onclick="event.stopPropagation();lbNav(-1)" aria-label="Previous photo">‹</button>
  <button class="lb-arrow next" onclick="event.stopPropagation();lbNav(1)" aria-label="Next photo">›</button>
  <img id="lbImg" src="" alt="Camp photo">
</div>

<script src="/gallery-photos.js"></script>
<script>

let lbUrls=[];
let lbIdx=0;
const grid=document.getElementById('grid');

function openLb(url){
  lbIdx=lbUrls.indexOf(url);
  document.getElementById('lbImg').src=url;
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow='';
}
function lbNav(dir){
  lbIdx=(lbIdx+dir+lbUrls.length)%lbUrls.length;
  document.getElementById('lbImg').src=lbUrls[lbIdx];
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowRight')lbNav(1);
  if(e.key==='ArrowLeft')lbNav(-1);
});

// PHOTOS comes from /gallery-photos.js, shared with the home page.
// Every tile is lazy except the first screenful, so the page paints right away.
grid.innerHTML='';
PHOTOS.forEach((id,i)=>{
  const fullUrl='/img/gallery/'+id+'.webp';
  lbUrls.push(fullUrl);
  const div=document.createElement('div');
  div.className='gitem';
  const img=document.createElement('img');
  img.loading=i<10?'eager':'lazy';img.decoding='async';img.width=600;img.height=450;
  img.src='/img/gallery/'+id+'-t.webp';
  img.alt='Camp Landau photo';
  // A photo that fails to load leaves no hole in the grid or the lightbox
  img.onerror=()=>{div.remove();lbUrls.splice(lbUrls.indexOf(fullUrl),1)};
  div.appendChild(img);
  div.addEventListener('click',()=>openLb(fullUrl));
  grid.appendChild(div);
});
</script>

<a class="ss-badge" id="ssBadge" href="https://simplysite.me" target="_blank" rel="noopener noreferrer">
  <span class="ss-txt">Built by</span>
  <img src="/img/simplysite.webp" width="286" height="72" alt="SimplySite">
</a>
<script>
// Step the floating credit aside once the footer, which carries the same credit, is on screen.
(function(){
  const badge=document.getElementById('ssBadge'),ft=document.querySelector('footer');
  if(!badge||!ft)return;
  new IntersectionObserver(e=>badge.classList.toggle('gone',e[0].isIntersecting)).observe(ft);
})();
</script>

</body>
</html>
